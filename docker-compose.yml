version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: rae-postgres
    restart: always
    environment:
      POSTGRES_DB: rae_db
      POSTGRES_USER: rae_user
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: rae-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: